<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- CSP: script-src has no 'unsafe-inline' anymore — all handlers are wired
     via addEventListener in TS modules. style 'unsafe-inline' stays for
     inline style attributes (dynamic tokens).
     connect-src has to allow https: at large. Downloading an episode and
     caching one while it plays both fetch the enclosure from whichever host
     the feed names, and a podcast's audio can be anywhere; an allowlist would
     have to contain the whole podcast internet. It is no wider than the
     media-src and img-src above, which already accept any https origin, and
     the app holds no account or token to exfiltrate. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'none';
  form-action 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  img-src 'self' data: https:;
  media-src https: blob: http://127.0.0.1:8787;
  connect-src 'self' https: ws: http://127.0.0.1:8787;
">
<title>Seseri</title>
<meta name="author" content="𝓐.𝓒.𝓑">
<meta name="description" content="Seseri — free, no-account, browser-based podcast player. Search via iTunes or paste an RSS feed URL — stream, resume and download episodes.">
<meta property="og:site_name" content="Seseri">
<meta property="og:title" content="Seseri">
<meta property="og:description" content="Seseri — free, no-account, browser-based podcast player. Search via iTunes or paste an RSS feed URL.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://iacbi.github.io/seseri/">
<meta property="og:image" content="https://iacbi.github.io/seseri/icons/icon-512.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="Seseri logo">
<meta name="twitter:card" content="summary">
<meta name="twitter:image:alt" content="Seseri logo">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seseri">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icons/seseri.svg">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Fonts are self-hosted (src/styles/fonts.css): no cross-origin stylesheet
     in front of first paint, nothing handed to Google, and the faces survive
     offline because the service worker can precache same-origin assets. -->
<link rel="preconnect" href="https://itunes.apple.com">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

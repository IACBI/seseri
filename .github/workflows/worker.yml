# Deploys the Cloudflare Worker in worker/ on release tags.
#
# Until this existed nothing in CI touched the Worker: pushing to main deploys
# only the Pages site, so a Worker fix sat in the repository looking shipped
# while production still ran the old code.
#
# Needs two secrets on the `worker-production` environment: CLOUDFLARE_API_TOKEN
# (the "Edit Cloudflare Workers" template plus Account · D1 · Edit, for the
# migrations step) and CLOUDFLARE_ACCOUNT_ID. The environment only admits
# `main` and `v*` tags, so a workflow edited on another branch cannot reach the
# token. Wrangler comes from worker/package-lock.json rather
# than a third-party action, so the version that deploys is the one the tests
# ran against.
name: Worker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Two deploys racing would leave production on whichever finished last.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: worker-production
      url: https://seseri-api.bozdogancanahmet.workers.dev
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # Fail with a message rather than a wrangler auth error halfway through.
      - name: Check credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on the worker-production environment."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Idempotent: applies only migrations D1 has not recorded yet, and runs
      # before the deploy so new code never meets an old schema.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply seseri-sync --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # The runner can reach workers.dev, which the author's machine cannot.
      # A fresh query string keeps the edge cache out of the answer, and a
      # forged localhost Origin must be refused by the deployed Worker.
      - name: Probe the deployed Worker
        run: |
          api=https://seseri-api.bozdogancanahmet.workers.dev
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "$api/?probe=$GITHUB_RUN_ID-$i") && break
            sleep 5
          done
          echo "$body" | grep -q '"ok":true' || { echo "::error::$api/ did not answer ok: $body"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost' \
            "$api/v1/itunes?url=https%3A%2F%2Fitunes.apple.com%2Fsearch%3Fterm%3Dprobe$GITHUB_RUN_ID")
          [ "$code" = 403 ] || { echo "::error::a localhost Origin got $code, expected 403"; exit 1; }

# Builds the Tauri Windows shell (NSIS installer) and, on tag pushes,
# attaches it to a DRAFT GitHub Release.
#
# NOTE: the installer is UNSIGNED pending a code-signing certificate
# (Azure Trusted Signing / an OV cert). Until one is configured, Windows
# SmartScreen will warn users on first run — this is expected.
name: Desktop (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri bundle
        run: npx tauri build
        working-directory: desktop

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seseri-nsis-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
